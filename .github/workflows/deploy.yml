name: Test, publish, and deploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: trade
          POSTGRES_PASSWORD: trade-test-password
          POSTGRES_DB: trade_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trade -d trade_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_TEST_URL: postgresql://trade:trade-test-password@localhost:5432/trade_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Build container
        run: docker build --tag trade-app:ci .

  publish-and-deploy:
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - name: Load deployment settings
        id: settings
        shell: bash
        run: |
          set -a
          source deploy/settings.env
          set +a
          IMAGE_NAME="$(printf '%s' "$GHCR_IMAGE" | tr '[:upper:]' '[:lower:]')"
          echo "image=$IMAGE_NAME" >> "$GITHUB_OUTPUT"
          echo "default_tag=$RENDER_DEFAULT_IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "service=$RENDER_SERVICE_NAME" >> "$GITHUB_OUTPUT"
      - name: Sign in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build and publish image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.settings.outputs.image }}:${{ steps.settings.outputs.default_tag }}
            ${{ steps.settings.outputs.image }}:${{ github.sha }}
      - name: Trigger Render image deploy
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGE_NAME: ${{ steps.settings.outputs.image }}
          IMAGE_TAG: ${{ github.sha }}
          RENDER_SERVICE_NAME: ${{ steps.settings.outputs.service }}
        run: |
          if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
            echo "::notice::Image published. Set the RENDER_DEPLOY_HOOK_URL GitHub secret to enable Render deployment for ${RENDER_SERVICE_NAME}."
            exit 0
          fi
          IMAGE_URL="${IMAGE_NAME}:${IMAGE_TAG}"
          ENCODED_IMAGE_URL="$(python -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$IMAGE_URL")"
          if [[ "$RENDER_DEPLOY_HOOK_URL" == *\?* ]]; then SEPARATOR='&'; else SEPARATOR='?'; fi
          curl --fail-with-body --silent --show-error --request POST \
            "${RENDER_DEPLOY_HOOK_URL}${SEPARATOR}imgURL=${ENCODED_IMAGE_URL}"
